name: OpenWrt-immortalwrt编译

on:
  schedule:
    - cron: 0 22 * * *
  push:
    paths:
      - OpenWrt-immortalwrt.config
      - diy-part1.sh
      - diy-part2.sh
      - files/**
  workflow_dispatch:
    inputs:
      force_build:
        description: 强制编译(无视配置/上游无变更检测)
        required: false
        default: false
        type: boolean
      clean_cache:
        description: 强制清空编译缓存（缓存腐化、持续卡死时启用）
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: OpenWrt-immortalwrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  COMPILE_THREAD: 2
  CACHE_KEY_VER: v1.2
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout 拉取自定义文件
        uses: actions/checkout@v6

      - name: 挂载4G Swap
        run: |
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo 10 | sudo tee /proc/sys/vm/swappiness
          free -h

      - name: 强制清理本地缓存文件
        if: github.event.inputs.clean_cache == 'true'
        run: |
          rm -rf openwrt .ccache ${{ env.CONFIG_FILE }} || true
          echo "✅ 本地缓存文件已清空"

      - name: 恢复编译缓存
        uses: actions/cache@v6
        with:
          path: |
            openwrt/dl
            .ccache
          key: mt798x-6.6-build-${{ env.CACHE_KEY_VER }}-${{ github.base_ref }}
          restore-keys: |
            mt798x-6.6-build-${{ env.CACHE_KEY_VER }}-

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          git gzip libncurses-dev libssl-dev libxml2-dev make nano pkgconf python3 python3-pip python3-setuptools \
          python3-dev rsync sed unzip wget zlib1g-dev timeout
          sudo timedatectl set-timezone ${{ env.TZ }}

      - name: Enable CCache
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV

      - name: Clone / Update source code
        run: |
          if [ ! -d openwrt ]; then
            git clone --depth=1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          else
            cd openwrt
            git fetch origin ${{ env.REPO_BRANCH }}
            git reset --hard origin/${{ env.REPO_BRANCH }}
          fi
          cd openwrt
          git rev-parse HEAD > ../upstream_commit.txt

      - name: 执行diy-part1.sh
        run: |
          chmod +x ${{ env.DIY_P1_SH }}
          ./${{ env.DIY_P1_SH }}

      - name: Load custom configuration & 执行diy-part2.sh
        run: |
          cp ${{ env.CONFIG_FILE }} openwrt/.config
          chmod +x ${{ env.DIY_P2_SH }}
          ./${{ env.DIY_P2_SH }}
          cd openwrt
          make defconfig

      - name: 提取插件配置用于检测变更
        run: |
          cd openwrt
          grep -E '^(CONFIG_PACKAGE_|CONFIG_LUCI_|CONFIG_COLLECT_)' .config | sort > ../current_pkg.txt

      - name: 判断是否执行完整编译 + 打印插件变更清单
        id: judge_build
        run: |
          NEED_BUILD=0
          FORCE=${{ github.event.inputs.force_build || false }}
          if [[ "$FORCE" == "true" ]]; then
            echo "⚠️ 手动开启强制编译"
            NEED_BUILD=1
          fi

          # 对比上游源码是否更新
          if [ -f last_commit.txt ] && [ -f upstream_commit.txt ]; then
            if ! diff -q last_commit.txt upstream_commit.txt >/dev/null; then
              echo "⚠️【上游源码更新】触发编译"
              NEED_BUILD=1
            fi
          fi

          # 对比插件配置
          if [ $NEED_BUILD -eq 0 ] && [ -f pkg_ref.txt ]; then
            echo "====================插件变更检测===================="
            echo "【本次新增插件/配置】"
            comm -13 pkg_ref.txt current_pkg.txt
            echo "----------------------------------------------------"
            echo "【移除/关闭的插件/配置】"
            comm -23 pkg_ref.txt current_pkg.txt
            echo "===================================================="
            if ! diff -q pkg_ref.txt current_pkg.txt >/dev/null; then
              echo "⚠️ 检测到插件配置变更，触发编译"
              NEED_BUILD=1
            fi
          elif [ $NEED_BUILD -eq 0 ]; then
            echo "ℹ️ 首次运行无缓存基准文件，执行编译"
            NEED_BUILD=1
          fi

          echo "NEED_BUILD=${NEED_BUILD}" >> $GITHUB_ENV
          if [[ "$NEED_BUILD" == "1" ]]; then
            cp upstream_commit.txt last_commit.txt
            cp current_pkg.txt pkg_ref.txt
          fi

      - name: Download package
        if: env.NEED_BUILD == '1'
        run: |
          cd openwrt
          make defconfig
          # 清理不完整下载文件
          find dl -size -1024c -delete
          echo "开始多线程下载源码包"
          timeout 1200 make download -j$(nproc) || {
            echo "多线程下载超时/失败，切换单线程重试"
            timeout 1200 make download -j1 V=s
          }
          find dl -size -1024c -delete
          echo "✅ 下载阶段完成"

      - name: Compile firmware
        id: compile
        if: env.NEED_BUILD == '1'
        run: |
          cd openwrt
          THREAD=${{ env.COMPILE_THREAD }}
          echo "===== 使用 ${THREAD} 线程编译固件 ====="
          nice -n 10 make -j${THREAD} || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "DEVICE_TARGET=$(grep CONFIG_TARGET_BOARD .config | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_ENV

      - name: 上传固件 Artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware-${{ env.DEVICE_TARGET }}
          path: |
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.manifest
          retention-days: 7

      - name: 发布Release
        if: steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-build-$(date +%Y%m%d-%H%M)
          name: OpenWrt自动构建 $(date +%Y-%m-%d)
          files: openwrt/bin/targets/**/*.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
