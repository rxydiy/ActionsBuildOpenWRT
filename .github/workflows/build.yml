name: OpenWrt-ImmortalWrt-MT798x-6.6编译

on:
  schedule:
    - cron: 0 23 * * *
  push:
    paths:
      - OpenWrt-immortalwrt.config
      - diy-part1.sh
      - diy-part2.sh
      - files/**
  workflow_dispatch:
    inputs:
      force_build:
        description: 强制编译（无视变更检测）
        required: false
        default: false
        type: boolean
      clean_cache:
        description: 清空缓存（缓存异常时勾选）
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: OpenWrt-immortalwrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  COMPILE_THREAD: 2
  CACHE_KEY_VER: v1.2
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 拉取仓库配置文件
        uses: actions/checkout@v6

      - name: 清理本地缓存
        if: github.event.inputs.clean_cache == 'true'
        run: |
          rm -rf openwrt .ccache build.log upstream_commit.txt last_commit.txt pkg_ref.txt current_pkg.txt || true
          echo "✅ 缓存清理完成"

      - name: 恢复编译缓存 dl + ccache
        uses: actions/cache@v6
        with:
          path: |
            openwrt/dl
            .ccache
          key: mt798x-6.6-${{ env.CACHE_KEY_VER }}
          restore-keys: |
            mt798x-6.6-${{ env.CACHE_KEY_VER }}

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
          git gzip libncurses-dev libssl-dev libxml2-dev make nano pkgconf python3 python3-pip python3-setuptools \
          python3-dev rsync sed unzip wget zlib1g-dev
          sudo timedatectl set-timezone ${{ env.TZ }}

      - name: 配置CCache
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=10G" >> $GITHUB_ENV

      - name: 克隆/更新源码
        run: |
          if [ ! -d openwrt ]; then
            git clone --depth=1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          else
            cd openwrt
            git fetch origin ${{ env.REPO_BRANCH }}
            git reset --hard origin/${{ env.REPO_BRANCH }}
          fi
          cd openwrt
          git rev-parse HEAD > ../upstream_commit.txt

      - name: 执行 diy-part1.sh
        run: |
          chmod +x ${{ env.DIY_P1_SH }}
          ./${{ env.DIY_P1_SH }}

      - name: 导入配置 + 执行 diy-part2.sh
        run: |
          cp ${{ env.CONFIG_FILE }} openwrt/.config
          chmod +x ${{ env.DIY_P2_SH }}
          ./${{ env.DIY_P2_SH }}
          cd openwrt
          make defconfig

      - name: 导出配置用于变更对比
        run: |
          cd openwrt
          grep -E '^(CONFIG_PACKAGE_|CONFIG_LUCI_)' .config | sort > ../current_pkg.txt

      - name: 判断是否启动编译
        id: judge_build
        run: |
          NEED_BUILD=0
          FORCE=${{ github.event.inputs.force_build || false }}
          if [[ "$FORCE" == "true" ]]; then
            echo "⚠️ 手动强制编译开启"
            NEED_BUILD=1
          fi

          if [ -f last_commit.txt ] && [ -f upstream_commit.txt ]; then
            if ! diff -q last_commit.txt upstream_commit.txt >/dev/null; then
              echo "⚠️ 上游源码更新，触发编译"
              NEED_BUILD=1
            fi
          fi

          if [ $NEED_BUILD -eq 0 ] && [ -f pkg_ref.txt ]; then
            echo "================配置变更===================="
            echo "新增:"
            comm -13 pkg_ref.txt current_pkg.txt
            echo "移除:"
            comm -23 pkg_ref.txt current_pkg.txt
            echo "============================================"
            if ! diff -q pkg_ref.txt current_pkg.txt >/dev/null; then
              echo "⚠️ 插件配置发生变化，开始编译"
              NEED_BUILD=1
            fi
          elif [ $NEED_BUILD -eq 0 ]; then
            echo "ℹ️ 首次构建，执行编译"
            NEED_BUILD=1
          fi

          echo "NEED_BUILD=${NEED_BUILD}" >> $GITHUB_ENV
          if [[ "$NEED_BUILD" == "1" ]]; then
            cp upstream_commit.txt last_commit.txt
            cp current_pkg.txt pkg_ref.txt
          fi

      - name: 预下载源码包
        if: env.NEED_BUILD == '1'
        run: |
          cd openwrt
          make defconfig
          find dl -size -1024c -delete
          timeout 1200 make download -j$(nproc) || timeout 1200 make download -j1 V=s
          find dl -size -1024c -delete
          echo "✅ 源码下载完成"

      - name: 编译固件
        id: compile_firm
        if: env.NEED_BUILD == '1'
        run: |
          cd openwrt
          THREAD=${{ env.COMPILE_THREAD }}
          LOG=${{ github.workspace }}/build.log
          set -o pipefail
          if nice -n 10 make -j${THREAD} 2>&1 | tee ${LOG}; then
            echo "result=ok" >> $GITHUB_OUTPUT
          else
            echo "❌ 多线程编译失败，切换单线程重试"
            cat ${LOG}
            if nice -n 10 make -j1 V=s 2>&1 | tee ${LOG}; then
              echo "result=ok" >> $GITHUB_OUTPUT
            else
              echo "❌ 编译最终失败"
              exit 1
            fi
          fi
          echo "BOARD=$(grep CONFIG_TARGET_BOARD .config | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_ENV

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        if: env.NEED_BUILD == '1'
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 上传固件文件
        if: steps.compile_firm.outputs.result == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware-${{ steps.compile_firm.outputs.BOARD }}
          path: |
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.manifest
          retention-days: 14

      - name: 创建Release发布
        if: steps.compile_firm.outputs.result == 'ok'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-$(date +%Y%m%d)
          name: MT798x 6.6内核自动构建 ${{ github.run_number }}
          files: openwrt/bin/targets/**/*.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
