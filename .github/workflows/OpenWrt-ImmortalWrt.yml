name: OpenWrt-ImmortalWrt编译

on:
  schedule:
    - cron: 0 21 * * *
  push:
    paths:
      - OpenWrt-immortalwrt.config
      - diy-part1.sh
      - diy-part2.sh
      - files/**
  workflow_dispatch:
    inputs:
      force_build:
        description: 强制编译（无视变更检测）
        required: false
        default: false
        type: boolean
      clean_cache:
        description: 清空缓存
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: OpenWrt-immortalwrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  COMPILE_THREAD: 2
  CACHE_KEY_VER: v1.2
  TZ: Asia/Shanghai
  TARGET_DIR: openwrt/bin/targets/mediatek/filogic

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 拉取仓库配置文件
        uses: actions/checkout@v6

      - name: 生成编译日期标签
        run: |
          echo "BUILD_TAG=build-$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "BUILD_DATETIME=$(date +%Y-%m-%d %H:%M)" >> $GITHUB_ENV
        env:
          TZ: Asia/Shanghai

      - name: 安装OpenWrt编译完整依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison quilt libssl-dev xsltproc libxml2-utils \
          zstd device-tree-compiler python3 python3-ply python3-docutils libelf-dev ccache

      - name: 清理本地缓存
        if: github.event.inputs.clean_cache == 'true'
        run: |
          rm -rf openwrt .ccache build.log upstream_commit.txt last_commit.txt pkg_ref.txt plugins_remote.txt plugins_last.txt plugin_changed_list.txt || true
          echo "✅ 缓存清理完成"

      - name: 恢复编译缓存 dl + ccache
        uses: actions/cache@v6
        with:
          path: |
            openwrt/dl
            .ccache
            last_commit.txt
            pkg_ref.txt
            plugins_last.txt
          key: mt798x-6.6-${{ env.CACHE_KEY_VER }}
          restore-keys: |
            mt798x-6.6-${{ env.CACHE_KEY_VER }}

      - name: 校验源码目录
        run: |
          if [ -d openwrt ]; then
            cd openwrt
            REMOTE_URL=$(git remote get-url origin)
            CURRENT_BRANCH=$(git symbolic-ref --short HEAD)
            if [[ "${REMOTE_URL}" != "${{ env.REPO_URL }}" || "${CURRENT_BRANCH}" != "${{ env.REPO_BRANCH }}" ]]; then
              echo "⚠️ 目录分支不匹配，重建源码"
              cd ..
              rm -rf openwrt
            fi
          fi

      - name: 克隆/更新源码
        run: |
          if [ ! -d openwrt ]; then
            git clone --depth=1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          else
            cd openwrt
            git fetch origin --prune
            git reset --hard origin/${{ env.REPO_BRANCH }}
            git clean -df
          fi
          cd openwrt
          git rev-parse HEAD > ../upstream_commit.txt

      - name: 检测第三方插件远程最新commit
        id: check_plugins
        run: |
          > plugins_remote.txt
          > plugin_changed_list.txt
          NEED_PLUGIN_UPDATE=0

          # 插件数组直接定义在脚本内部，彻底规避环境变量解析错误
          plugin_list=(
            "https://github.com/gdy666/luci-app-lucky.git;main"
            "https://github.com/sirpdboy/luci-app-taskplan.git;master"
            "https://github.com/kenzok8/small.git;main"
            "https://github.com/whzhni1/luci-app-vnt2.git;main"
            "https://github.com/jcorporation/myMPD.git;master"
          )

          for item in "${plugin_list[@]}"; do
            IFS=';' read repo_url branch <<< "$item"
            echo "检测仓库: $repo_url 分支:$branch"
            remote_commit=$(timeout 10 git ls-remote --heads "$repo_url" "$branch" 2>/dev/null | awk '{print $1}')
            if [ -z "$remote_commit" ]; then
              echo "❌ 获取插件commit失败: $repo_url $branch，判定存在更新"
              NEED_PLUGIN_UPDATE=1
              echo "$repo_url;$branch;FAIL_NETWORK" >> plugin_changed_list.txt
              continue
            fi
            echo "$repo_url;$branch;$remote_commit" >> plugins_remote.txt
          done

          if [ -f plugins_last.txt ]; then
            # 对比旧快照，查找更新/移除插件
            while IFS= read -r line; do
                repo=$(echo "$line" | cut -d';' -f1)
                branch=$(echo "$line" | cut -d';' -f2)
                old_hash=$(echo "$line" | cut -d';' -f3)
                new_line=$(grep "^${repo};${branch};" plugins_remote.txt || true)
                if [ -z "$new_line" ]; then
                  echo "⚠️ 插件 $repo $branch 在上一轮快照存在，本轮缺失"
                  NEED_PLUGIN_UPDATE=1
                  echo "$repo;$branch;REMOVE" >> plugin_changed_list.txt
                  continue
                fi
                new_hash=$(echo "$new_line" | cut -d';' -f3)
                if [[ "$old_hash" != "$new_hash" ]]; then
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  echo "✅【插件检测到更新】$repo"
                  echo "分支: $branch"
                  echo "旧HASH: $old_hash"
                  echo "新HASH: $new_hash"
                  echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                  NEED_PLUGIN_UPDATE=1
                  echo "$repo;$branch;$old_hash->$new_hash" >> plugin_changed_list.txt
                fi
            done < plugins_last.txt

            # 查找新增插件
            while IFS= read -r line; do
              repo=$(echo "$line" | cut -d';' -f1)
              branch=$(echo "$line" | cut -d';' -f2)
              if ! grep -q "^${repo};${branch};" plugins_last.txt; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "✅【新增插件】$repo 分支:$branch"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                NEED_PLUGIN_UPDATE=1
                echo "$repo;$branch;NEW_ADD" >> plugin_changed_list.txt
              fi
            done < plugins_remote.txt

            if [ $NEED_PLUGIN_UPDATE -eq 0 ]; then
              echo "✅ 所有插件无更新"
            fi
          else
            echo "ℹ️ 首次插件快照，触发编译"
            NEED_PLUGIN_UPDATE=1
            echo "FIRST_INIT;;FIRST_BUILD" >> plugin_changed_list.txt
          fi
          echo "NEED_PLUGIN_UPDATE=${NEED_PLUGIN_UPDATE}" >> $GITHUB_ENV

      - name: 执行 diy-part1.sh
        run: |
          chmod +x ${{ env.DIY_P1_SH }}
          cd openwrt
          ../${{ env.DIY_P1_SH }}

      - name: 导入配置 + 执行 diy-part2.sh
        run: |
          cp ${{ env.CONFIG_FILE }} openwrt/.config
          chmod +x ${{ env.DIY_P2_SH }}
          cd openwrt
          ../${{ env.DIY_P2_SH }}
          make defconfig

      - name: 导出配置用于变更对比
        run: |
          cd openwrt
          grep -E '^(CONFIG_PACKAGE_|CONFIG_LUCI_)' .config | sort > ../current_pkg.txt

      - name: 判断是否启动编译
        id: judge_build
        run: |
          NEED_BUILD=0
          FORCE=${{ github.event.inputs.force_build }}
          if [[ "$FORCE" == "true" ]]; then
            echo "⚠️ 手动强制编译开启"
            NEED_BUILD=1
          fi

          # 上游源码更新
          if [ $NEED_BUILD -eq 0 ] && [ -f last_commit.txt ] && [ -f upstream_commit.txt ]; then
            if ! diff -q last_commit.txt upstream_commit.txt >/dev/null; then
              echo "⚠️ 上游源码更新，触发编译"
              NEED_BUILD=1
            fi
          fi

          # 第三方插件更新
          if [ $NEED_BUILD -eq 0 ] && [ ${{ env.NEED_PLUGIN_UPDATE }} -eq 1 ]; then
            echo "⚠️ 第三方插件存在变更，触发编译"
            NEED_BUILD=1
          fi

          # 配置文件变更
          if [ $NEED_BUILD -eq 0 ]; then
            if [ ! -f pkg_ref.txt ]; then
              echo "ℹ️ 首次构建，执行编译"
              NEED_BUILD=1
            elif ! diff -q pkg_ref.txt current_pkg.txt >/dev/null; then
              echo "⚠️ 固件配置发生变化，开始编译"
              NEED_BUILD=1
            else
              echo "✅ 源码、插件与配置无变更，跳过编译"
            fi
          fi

          echo "NEED_BUILD=${NEED_BUILD}" >> $GITHUB_ENV

      - name: 预下载源码包
        if: env.NEED_BUILD == '1'
        run: |
          cd openwrt
          make defconfig
          find dl -size -1024c -exec rm -f {} \;
          make download -j$(nproc) || make download -j1 V=s
          echo "✅ 源码包下载完成"

      - name: 编译固件
        id: compile_firm
        if: env.NEED_BUILD == '1'
        run: |
          cd openwrt
          THREAD=${{ env.COMPILE_THREAD }}
          LOG=${{ github.workspace }}/build.log
          set -o pipefail
          RESULT="fail"
          if nice -n 10 make -j${THREAD} 2>&1 | tee ${LOG}; then
            RESULT="ok"
          else
            echo "❌ 多线程编译失败，切换单线程重试"
            cat ${LOG}
            if nice -n 10 make -j1 V=s 2>&1 | tee ${LOG}; then
              RESULT="ok"
            else
              echo "❌ 编译最终失败"
              exit 1
            fi
          fi
          BOARD=$(grep CONFIG_TARGET_BOARD .config | cut -d'=' -f2 | tr -d '"')
          echo "result=${RESULT}" >> $GITHUB_OUTPUT
          echo "BOARD=${BOARD}" >> $GITHUB_OUTPUT

      - name: 更新缓存快照
        if: steps.compile_firm.outputs.result == 'ok'
        run: |
          cp upstream_commit.txt last_commit.txt
          cp current_pkg.txt pkg_ref.txt
          cp plugins_remote.txt plugins_last.txt
          echo "✅ 全部快照已更新"

      - name: 上传插件变更清单
        uses: actions/upload-artifact@v4
        if: env.NEED_BUILD == '1'
        with:
          name: plugin-change-log
          path: plugin_changed_list.txt
          retention-days: 7

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        if: env.NEED_BUILD == '1'
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: 上传固件文件（Artifact）
        if: steps.compile_firm.outputs.result == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware-${{ steps.compile_firm.outputs.BOARD }}
          path: |
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.manifest
          retention-days: 14

      - name: 创建Release发布
        if: steps.compile_firm.outputs.result == 'ok'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: MT798x 6.6内核自动构建 ${{ env.BUILD_DATETIME }}
          files: |
            ${{ env.TARGET_DIR }}/*
            !${{ env.TARGET_DIR }}/packages/**/*
          generate_release_notes: true
          overwrite: true

      # 清理旧Release，保留最新5个
      - name: Retain latest 5 releases, remove older releases & tags
        if: steps.compile_firm.outputs.result == 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const reserveCount = 5;
            console.log(`设置保留最新 ${reserveCount} 个正式Release`);

            const { data: releases } = await github.rest.repos.listReleases({
              owner, repo, per_page: 100
            });

            const validReleases = releases
              .filter(item => !item.draft)
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            console.log(`当前正式Release总数：${validReleases.length}`);
            const removeList = validReleases.slice(reserveCount);
            console.log(`待删除数量：${removeList.length}`);

            for (const release of removeList) {
              console.log(`开始删除 Release: ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner, repo, release_id: release.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: `tags/${release.tag_name}`
                });
                console.log(`标签 ${release.tag_name} 删除成功`);
              } catch (err) {
                console.log(`标签 ${release.tag_name} 删除警告：`, err.message);
              }
            }
