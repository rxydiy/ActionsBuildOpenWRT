name: OpenWrt-ImmortalWrt

on:
  # UTC 21:00 = 北京时间05:00
  schedule:
    - cron: 0 21 * * *
  push:
    paths:
      - OpenWrt-immortalwrt.config
      - diy-part1.sh
      - diy-part2.sh
      - files/**
  workflow_dispatch:
    inputs:
      force_build:
        description: 强制编译（无视变更检测）
        required: false
        default: false
        type: boolean
      clean_cache:
        description: 清空缓存
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: OpenWrt-immortalwrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  COMPILE_THREAD: 2
  CACHE_KEY_VER: v1.2
  TZ: Asia/Shanghai
  TARGET_DIR: openwrt/bin/targets/mediatek/filogic

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库配置文件
        uses: actions/checkout@v4

      - name: 第三方插件更新检测
        shell: bash
        run: |
          # ⚠️和 diy-part1.sh 内git clone插件保持一致
          PLUGINS=(
          "https://github.com/gdy666/luci-app-lucky.git;main"
          "https://github.com/sirpdboy/luci-app-taskplan.git;master"
          "https://github.com/kenzok8/small.git;main"
          "https://github.com/whzhni1/luci-app-vnt2.git;main"
          "https://github.com/jcorporation/myMPD.git;master"
          )

          > plugins_remote.txt
          > plugin_changed_list.txt
          NEED_PLUGIN_UPDATE=0

          for item in "${PLUGINS[@]}"; do
            IFS=';' read repo_url branch <<< "$item"
            echo "检测仓库: $repo_url 分支:$branch"

            remote_commit=""
            # 最多3次重试，单次超时12秒
            for retry in {1..3}; do
              remote_commit=$(timeout 12 git ls-remote --heads "$repo_url" "$branch" 2>/dev/null | awk '{print $1}')
              if [[ -n "$remote_commit" ]]; then
                break
              fi
              echo "🔄 第${retry}次重试获取commit $repo_url $branch"
              sleep 2
            done

            if [[ -z "$remote_commit" ]]; then
              echo "❌ 获取插件commit失败: $repo_url $branch，本次跳过对比，不判定更新"
              continue
            fi
            echo "${repo_url};${branch};${remote_commit}" >> plugins_remote.txt
          done

          if [[ ! -f plugins_last.txt ]]; then
            echo "ℹ️ 首次插件快照，触发编译"
            NEED_PLUGIN_UPDATE=1
            echo "FIRST_INIT;;FIRST_BUILD" >> plugin_changed_list.txt
            cp plugins_remote.txt plugins_last.txt
          else
            # 对比已有插件commit变更
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              repo=$(echo "$line" | cut -d';' -f1)
              branch=$(echo "$line" | cut -d';' -f2)
              old_hash=$(echo "$line" | cut -d';' -f3)
              remote_line=$(grep "^${repo};${branch};" plugins_remote.txt || true)
              [[ -z "$remote_line" ]] && continue
              new_hash=$(echo "$remote_line" | cut -d';' -f3)

              if [[ "$old_hash" != "$new_hash" ]]; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "🔃【插件更新】$repo 分支:$branch"
                echo "旧commit: $old_hash"
                echo "新commit: $new_hash"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                NEED_PLUGIN_UPDATE=1
                echo "$repo;$branch;$old_hash->$new_hash" >> plugin_changed_list.txt
              fi
            done < plugins_last.txt

            # 检测新增插件
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              repo=$(echo "$line" | cut -d';' -f1)
              branch=$(echo "$line" | cut -d';' -f2)
              if ! grep -q "^${repo};${branch};" plugins_last.txt; then
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                echo "✅【新增插件】$repo 分支:$branch"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                NEED_PLUGIN_UPDATE=1
                echo "$repo;$branch;NEW_ADD" >> plugin_changed_list.txt
              fi
            done < plugins_remote.txt

            # 更新快照文件
            cp plugins_remote.txt plugins_last.txt

            if [[ $NEED_PLUGIN_UPDATE -eq 0 ]]; then
              echo "✅ 所有插件无更新"
            fi
          fi

          echo "NEED_PLUGIN_UPDATE=${NEED_PLUGIN_UPDATE}" >> $GITHUB_ENV

      - name: 判断是否继续编译
        shell: bash
        run: |
          FORCE_BUILD=${{ github.event.inputs.force_build }}
          if [[ "${FORCE_BUILD}" == "true" ]]; then
            echo "⚙️ 手动开启强制编译，继续执行"
          elif [[ "${NEED_PLUGIN_UPDATE}" == "0" ]]; then
            echo "🛑 插件无任何更新，终止编译任务"
            exit 0
          fi

      # ======================下方为标准OpenWrt编译流程==========================
      - name: 安装编译依赖
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: 克隆ImmortalWrt源码
        shell: bash
        run: |
          git clone -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行自定义脚本diy-part1.sh
        shell: bash
        run: |
          chmod +x $DIY_P1_SH
          ./$DIY_P1_SH

      - name: 加载配置文件
        shell: bash
        run: |
          cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig

      - name: 执行自定义脚本diy-part2.sh
        shell: bash
        run: |
          chmod +x $DIY_P2_SH
          ./$DIY_P2_SH

      - name: 预下载编译文件
        shell: bash
        run: |
          cd openwrt
          make download -j${COMPILE_THREAD}

      - name: 开始编译固件
        shell: bash
        run: |
          cd openwrt
          make -j${COMPILE_THREAD}

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: MT798x-Firmware
          path: ${{ env.TARGET_DIR }}
